<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kavidu_H_Premasiri – 3D Portfolio</title>
  <meta name="description" content="Kavidu_H_Premasiri – Software Engineering Intern. Interactive 3D portfolio: SLIIT University, NupaStack and My Projects Lab.">
  <meta name="theme-color" content="#2a1450">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preload" href="js/app.js" as="script">
</head>
<body class="overflow-hidden bg-[#2a1450] font-sans text-white antialiased">

  <!-- 3D canvas (full screen) -->
  <canvas id="scene" class="fixed inset-0 h-full w-full cursor-grab touch-none"></canvas>

  <!-- Loader -->
  <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-gradient-to-b from-[#1b1040] via-[#4a2275] to-[#d9608f] transition-opacity duration-700">
    <div class="grid h-24 w-24 place-items-center rounded-full border border-cyan-300/60 bg-cyan-300/10 text-3xl font-bold text-cyan-200 shadow-[0_0_40px_rgba(34,211,238,.5)] animate-pulse">KP</div>
    <p id="loader-text" class="px-6 text-center text-sm text-white/80">Building the 3D island…</p>
    <div id="loader-bar" class="h-1.5 w-56 overflow-hidden rounded-full bg-white/15"><div id="loader-fill" class="h-full w-0 rounded-full bg-cyan-300 transition-all duration-500"></div></div>
  </div>

  <!-- Top bar -->
  <header class="pointer-events-none fixed inset-x-0 top-0 z-20 flex items-start justify-between p-4 sm:p-6">
    <button data-view="home" class="glass pointer-events-auto flex items-center gap-3 rounded-full py-1.5 pl-1.5 pr-4 transition hover:bg-white/10" aria-label="Home">
      <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-cyan-300 to-blue-500 text-sm font-bold text-[#0b1230]">KP</span>
      <span class="hidden whitespace-nowrap text-sm font-semibold lg:block" data-name>Kavidu_H_Premasiri</span>
    </button>
    <nav class="glass pointer-events-auto hidden items-center gap-1 rounded-full p-1.5 md:flex" aria-label="Main">
      <button data-view="home" class="nav-btn is-active">Home</button>
      <button data-view="about" class="nav-btn">About</button>
      <button data-view="sliit" class="nav-btn">Education</button>
      <button data-view="nupa" class="nav-btn">NupaStack</button>
      <button data-view="labs" class="nav-btn">Projects</button>
    </nav>
    <div class="pointer-events-auto flex items-center gap-2">
      <a id="social-gh" target="_blank" rel="noopener" class="glass grid h-10 w-10 place-items-center rounded-full text-xs font-semibold transition hover:bg-white/15" aria-label="GitHub">GH</a>
      <a id="social-in" target="_blank" rel="noopener" class="glass grid h-10 w-10 place-items-center rounded-full text-xs font-semibold transition hover:bg-white/15" aria-label="LinkedIn">in</a>
      <a id="social-mail" class="glass grid h-10 w-10 place-items-center rounded-full text-xs font-semibold transition hover:bg-white/15" aria-label="Email">@</a>
    </div>
  </header>

  <!-- Mobile bottom nav -->
  <nav class="glass fixed inset-x-3 bottom-3 z-20 flex justify-between rounded-full p-1.5 md:hidden" aria-label="Sections">
    <button data-view="home" class="nav-btn is-active !px-3 !text-xs">Home</button>
    <button data-view="about" class="nav-btn !px-3 !text-xs">About</button>
    <button data-view="sliit" class="nav-btn !px-3 !text-xs">Education</button>
    <button data-view="nupa" class="nav-btn !px-3 !text-xs">NupaStack</button>
    <button data-view="labs" class="nav-btn !px-3 !text-xs">Projects</button>
  </nav>

  <!-- Hint -->
  <div id="hint" class="pointer-events-none fixed inset-x-0 bottom-20 z-10 flex justify-center px-4 transition-opacity duration-700 md:bottom-6">
    <p class="glass rounded-full px-5 py-2 text-center text-xs text-white/85 sm:text-sm">Drag to look around · Scroll or pinch to zoom · Tap a building to explore</p>
  </div>

  <!-- Hover tooltip -->
  <div id="tip" class="glass pointer-events-none fixed left-0 top-0 z-20 rounded-full px-3 py-1 text-xs font-medium opacity-0 transition-opacity"></div>

  <!-- Info panel -->
  <aside id="panel" data-open="false" class="glass overflow-y-auto rounded-3xl p-6 shadow-2xl" aria-live="polite">
    <button id="p-close" class="absolute right-4 top-4 grid h-8 w-8 place-items-center rounded-full bg-white/10 text-lg leading-none transition hover:bg-white/20" aria-label="Close">×</button>
    <p id="p-kicker" class="pr-10 text-xs font-semibold uppercase tracking-widest text-cyan-300"></p>
    <h2 id="p-title" class="mt-1 pr-8 text-2xl font-bold sm:text-3xl"></h2>
    <p id="p-text" class="mt-3 text-sm leading-relaxed text-white/80"></p>
    <ul id="p-points" class="mt-4 space-y-2 text-sm text-white/90"></ul>
    <div id="p-projects" class="mt-5 space-y-3"></div>
    <div id="p-groups" class="mt-5 space-y-4"></div>
    <div id="p-tags" class="mt-5 flex flex-wrap gap-2"></div>
    <div id="p-buttons" class="mt-5 flex flex-wrap gap-2"></div>
  </aside>

  <noscript><p class="fixed inset-0 z-[60] grid place-items-center bg-[#1b1040] p-8 text-center">Please enable JavaScript to view the 3D portfolio.</p></noscript>
  <script src="js/app.js" defer></script>
</body>
</html>
